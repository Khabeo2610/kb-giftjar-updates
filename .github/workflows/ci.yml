name: KB Studio Pro CI

on:
  push:
    branches: ['claude/**', 'main']
    paths-ignore: ['update-manifest.json']
  pull_request:

jobs:
  web:
    name: Typecheck · Lint · Test · Build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  windows:
    name: Build Windows x64 (chưa ký số)
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Rust lint + tests (SQLite, migration)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build installer
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kb-studio-pro-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
